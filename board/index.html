<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- The society website's icon: the full logo on a white square. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bristol FSAI's live planning board for the 2026–27 plan." />
    <title>Bristol FSAI Board</title>
    <!-- Link previews (WhatsApp, Teams, Slack). They need full addresses: VITE_SITE_URL is set in vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bristol FSAI" />
    <meta property="og:title" content="Bristol FSAI Board" />
    <meta property="og:description" content="Bristol FSAI's live planning board for the 2026–27 plan." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Bristol FSAI logo" />
    <meta name="twitter:card" content="summary" />
    <script>
      // The saved theme before the first paint, so the page never flashes the wrong one (see src/lib/theme.ts).
      // Nothing saved yet (a first visit): light.
      ;(function () {
        var choice = null
        try {
          choice = localStorage.getItem('fsai-board:theme')
        } catch (error) {
          // storage unavailable: use the default
        }
        var deviceDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = choice === 'dark' || (choice === 'system' && deviceDark) ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
